# Disposable PostgreSQL for integration tests (advisory locks and
# transactions must run against a real database, not mocks).
#   pnpm test:db:up && pnpm test
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: pf
      POSTGRES_PASSWORD: pf
      POSTGRES_DB: pf_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pf -d pf_test"]
      interval: 2s
      timeout: 3s
      retries: 20
