services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: godswill
      POSTGRES_DB: pathFinderBE
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pathfinder-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pathfinder-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    environment:
      - NODE_ENV=production
    networks:
      - backend
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npm run build
        npm start
      "
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      # start_period: 40s
  # nginx:
  #   image: nginx:stable-alpine
  #   container_name: nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     pathfinder-api:
  #       condition: service_healthy
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   networks:
  #     - backend

volumes:
  redis_data:
  pg_data:

networks:
  backend:
    driver: bridge
